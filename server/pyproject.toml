[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flypaper"
version = "0.2.0"
description = "Сервер сайта Flypaper: статика, табло Пулково и живые рейсы для обоев"
requires-python = ">=3.10"
dependencies = [
    "FlightRadarAPI>=1.6",
    "flydenity==0.1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flypaper = "flypaper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
